<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOC Fitness — The Playbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0D0D0D; --white: #FFFFFF;
      --blue: #2F6DB5; --gold: #F2A61D;
      --dark: #1A1A1A; --mid: #333333; --muted: #888888;
      --font-head: 'Barlow Condensed', sans-serif;
      --font-body: 'Barlow', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--black); color: var(--white); font-family: var(--font-body); font-size: 16px; line-height: 1.7; min-height: 100vh; display: flex; flex-direction: column; }

    /* ── HEADER ── */
    .post-header { background: var(--black); border-bottom: 4px solid var(--gold); padding: 0 48px; height: 64px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .post-header img { height: 36px; }
    .post-header a { font-family: var(--font-head); font-weight: 800; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); text-decoration: none; }
    .post-header a:hover { color: #e09810; }

    /* ── HERO ── */
    .post-hero {
      position: relative;
      background: var(--dark);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
    }
    .post-hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .post-hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #0D0D0D 0%, #1a2a1a 40%, #2F6DB5 100%);
    }
    .post-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(13,13,13,0.95) 0%, rgba(13,13,13,0.4) 60%, transparent 100%);
    }
    .post-hero-content {
      position: relative;
      width: 100%;
      max-width: 860px;
      padding: 48px 48px;
      z-index: 1;
    }
    .post-category {
      display: inline-block;
      background: var(--gold);
      color: var(--black);
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 3px;
      margin-bottom: 16px;
    }
    .post-title {
      font-family: var(--font-head);
      font-weight: 900;
      font-size: 52px;
      text-transform: uppercase;
      line-height: 0.95;
      color: var(--white);
      margin-bottom: 16px;
      letter-spacing: 0.02em;
    }
    .post-meta {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ── BODY ── */
    .post-body {
      flex: 1;
      max-width: 760px;
      margin: 0 auto;
      padding: 64px 48px 96px;
      width: 100%;
    }

    .post-content h1,
    .post-content h2,
    .post-content h3 {
      font-family: var(--font-head);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--white);
      margin: 40px 0 16px;
      line-height: 1.1;
    }
    .post-content h1 { font-size: 36px; }
    .post-content h2 { font-size: 28px; }
    .post-content h3 { font-size: 22px; color: var(--gold); }

    .post-content p {
      font-size: 16px;
      color: rgba(255,255,255,0.8);
      line-height: 1.8;
      margin-bottom: 24px;
    }

    .post-content ul,
    .post-content ol {
      margin: 0 0 24px 20px;
    }

    .post-content li {
      font-size: 16px;
      color: rgba(255,255,255,0.8);
      line-height: 1.8;
      margin-bottom: 8px;
      padding-left: 8px;
    }

    .post-content strong { color: var(--white); font-weight: 600; }
    .post-content em { color: var(--gold); font-style: normal; }

    .post-content blockquote {
      border-left: 3px solid var(--gold);
      padding: 16px 24px;
      margin: 32px 0;
      background: var(--dark);
      border-radius: 0 6px 6px 0;
      font-size: 18px;
      font-style: italic;
      color: rgba(255,255,255,0.7);
    }

    .post-content hr {
      border: none;
      border-top: 1px solid #222;
      margin: 40px 0;
    }

    /* ── BACK LINK ── */
    .post-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: none;
      margin-bottom: 48px;
      border-bottom: 1px solid rgba(242,166,29,0.3);
      padding-bottom: 2px;
      transition: border-color 0.2s;
    }
    .post-back:hover { border-color: var(--gold); }

    /* ── LOADING / ERROR ── */
    .post-loading {
      text-align: center;
      padding: 80px 0;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ── FOOTER ── */
    .post-footer {
      padding: 24px 48px;
      border-top: 1px solid #1a1a1a;
      text-align: center;
      flex-shrink: 0;
    }
    .post-footer p { font-size: 11px; color: #444; letter-spacing: 0.06em; }
    .post-footer span { color: var(--gold); }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .post-header { padding: 0 20px; }
      .post-hero-content { padding: 32px 20px; }
      .post-title { font-size: 34px; }
      .post-body { padding: 40px 20px 64px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="post-header">
    <img src="./socfitness-assets/SOC_logo.png" alt="SOC Fitness" />
    <a href="./socfitness-website.html#blog">← Back to The Playbook</a>
  </header>

  <!-- HERO (populated by JS) -->
  <div class="post-hero" id="post-hero">
    <div class="post-hero-gradient"></div>
    <div class="post-hero-overlay"></div>
    <div class="post-hero-content" id="post-hero-content">
      <div class="post-loading">Loading article...</div>
    </div>
  </div>

  <!-- BODY -->
  <main class="post-body">
    <a href="./socfitness-website.html#blog" class="post-back">← Back to The Playbook</a>
    <div class="post-content" id="post-content"></div>
  </main>

  <!-- FOOTER -->
  <footer class="post-footer">
    <p>SOC Fitness — The Playbook &middot; <span>Stephen J Cleary</span></p>
  </footer>

  <script>
    const SPACE = '2ua0u0uuc2c3';
    const TOKEN = 'ynQSkE7aXiRHGExiueEFZWAqaUEjKMzOE9t32nzFuvE';

    const slug = new URLSearchParams(window.location.search).get('slug');

    if (!slug) {
      document.getElementById('post-hero-content').innerHTML = '<div class="post-loading">No article specified.</div>';
    } else {
      (async function() {
        try {
          const url = `https://cdn.contentful.com/spaces/${SPACE}/entries?content_type=blogPost&fields.slug=${encodeURIComponent(slug)}&limit=1&include=2&access_token=${TOKEN}`;
          const res  = await fetch(url);
          const data = await res.json();

          if (!data.items || data.items.length === 0) {
            document.getElementById('post-hero-content').innerHTML = '<div class="post-loading">Article not found.</div>';
            return;
          }

          const item = data.items[0];
          const f    = item.fields;
          const assets = {};
          (data.includes?.Asset || []).forEach(a => { assets[a.sys.id] = a; });

          // Update page title
          document.title = `${f.title} — SOC Fitness`;

          // Cover image — try inline fields first, then includes lookup
          const imgId    = f.coverImage?.sys?.id;
          const imgAsset = imgId ? assets[imgId] : null;
          const imgFileUrl = f.coverImage?.fields?.file?.url        // inline (resolved)
                          || imgAsset?.fields?.file?.url;           // includes lookup
          if (imgFileUrl) {
            const imgUrl = 'https:' + imgFileUrl + '?w=1400&h=840&fit=fill';
            const img = document.createElement('img');
            img.src = imgUrl;
            img.className = 'post-hero-img';
            img.alt = f.title;
            document.getElementById('post-hero').prepend(img);
          }

          // Date
          const date = f.publishedDate
            ? new Date(f.publishedDate).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' })
            : '';

          // Hero content
          document.getElementById('post-hero-content').innerHTML = `
            ${f.category ? `<span class="post-category">${f.category}</span>` : ''}
            <h1 class="post-title">${f.title}</h1>
            ${date ? `<div class="post-meta">${date}</div>` : ''}
          `;

          // Render rich text body
          const body = f.body;
          if (body) {
            document.getElementById('post-content').innerHTML = renderRichText(body);
          }

        } catch(e) {
          console.error(e);
          document.getElementById('post-hero-content').innerHTML = '<div class="post-loading">Could not load article.</div>';
        }
      })();
    }

    // ── RICH TEXT RENDERER ──────────────────────────
    function renderRichText(doc) {
      return doc.content.map(node => renderNode(node)).join('');
    }

    function renderNode(node) {
      switch(node.nodeType) {
        case 'paragraph':
          return `<p>${renderInlines(node.content)}</p>`;
        case 'heading-1':
          return `<h1>${renderInlines(node.content)}</h1>`;
        case 'heading-2':
          return `<h2>${renderInlines(node.content)}</h2>`;
        case 'heading-3':
          return `<h3>${renderInlines(node.content)}</h3>`;
        case 'unordered-list':
          return `<ul>${node.content.map(li => `<li>${renderInlines(li.content[0]?.content || [])}</li>`).join('')}</ul>`;
        case 'ordered-list':
          return `<ol>${node.content.map(li => `<li>${renderInlines(li.content[0]?.content || [])}</li>`).join('')}</ol>`;
        case 'blockquote':
          return `<blockquote>${node.content.map(n => renderInlines(n.content)).join('')}</blockquote>`;
        case 'hr':
          return '<hr>';
        default:
          return '';
      }
    }

    function renderInlines(nodes) {
      return (nodes || []).map(node => {
        if (node.nodeType === 'text') {
          let text = node.value || '';
          (node.marks || []).forEach(mark => {
            if (mark.type === 'bold')   text = `<strong>${text}</strong>`;
            if (mark.type === 'italic') text = `<em>${text}</em>`;
            if (mark.type === 'code')   text = `<code>${text}</code>`;
          });
          return text;
        }
        if (node.nodeType === 'hyperlink') {
          return `<a href="${node.data.uri}" style="color:var(--gold);">${renderInlines(node.content)}</a>`;
        }
        return '';
      }).join('');
    }
  </script>
</body>
</html>
