<!DOCTYPE html>

<meta charset="UTF-8">

<title>I Could Have Scored That!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0d1a0d;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }

    display: flex;
    align-items: center;
    justify-content: center;

<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
'use strict';

/* =========================================================
   I COULD HAVE SCORED THAT!
   Five real World Cup goals, recreated. Score them yourself.
   Single-file canvas game. No libraries.
   =========================================================
   World coordinates:
     x = lateral metres (0 = centre of goal, + = right)
     y = depth metres from the goal line (goal at y=0)
     z = height metres
   ========================================================= */

// ---------- CANVAS & SCALING ----------
const W = 800, H = 600;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let rotated = false;  // portrait phones: rotate the canvas 90° so the game fills the screen
function fitCanvas() {
  const vw = window.innerWidth, vh = window.innerHeight;
  rotated = vh > vw * 1.2 && vw < 700;
  const s = rotated
    ? Math.min(vh * 0.97 / W, vw * 0.97 / H)
    : Math.min(vw / W, vh * 0.97 / H);
  canvas.style.width  = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
  canvas.style.transform = rotated ? 'rotate(90deg)' : '';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ---------- CAMERA / PROJECTION (tune these by eye) ----------
const CAM = {
  focal: 560,     // perspective strength
  horizon: 200,   // screen y of the horizon
  height: 2.4,    // camera height (m)
  behind: 5.0,    // camera distance behind the ball start (m)
  x: 0, y: 28     // set per level in loadLevel()
};

function project(x, y, z) {
  const d = Math.max(CAM.y - y, 0.6);
  const s = CAM.focal / d;
  return {
    x: W / 2 + (x - CAM.x) * s,
    y: CAM.horizon + (CAM.height - z) * s,
    s: s
  };
}

// ---------- PHYSICS CONSTANTS ----------
const GRAV = 9.81;
const DRAG = 0.28;          // per-second exponential decay
const GOAL_HW = 3.66;       // goal half width (m)
const BAR_H  = 2.44;        // crossbar height (m)
const POST_R = 0.16;        // post/bar band half-thickness for woodwork

// ---------- LEVEL CONFIGS (all 5; tune from screengrabs later) ----------
const LEVELS = [

    // incoming bouncing ball: drops from header, bounces once, strike it on the rise
    script: { inX: 2.7, inY: 25.8, inZ: 2.9, inVx: -0.5, inVy: -3.6, sweet: 0.25 },

    ballStart: { x: 0.3, y: 16 },

    defenders: [

    ],
    defKit: '#7ab8e8', defKit2: '#1a1a2a',     // Uruguay sky blue, black shorts
    selfKit: '#ffe14d', selfKit2: '#1d3a8f',   // Colombia yellow, blue shorts
    wind: { min: 0, max: 0 },
    // long ball drops steeply from above; chest window, then the volley
    script: { inX: 0.7, inY: 26, inZ: 7.0, inVx: -0.2, inVy: -2.8, chestPop: 2.6, sweetZ: 0.5 }
  },
  {
    id: 'maradona', implemented: true, num: 10, mechanic: 'dribble',
    title: 'DIEGO MARADONA', subtitle: 'ARGENTINA 2-1 ENGLAND', venue: "AZTECA · MEXICO '86",
    brief: 'Pick it up in your own half. Outrun the chasers, skip the challenges, round Shilton and finish before the slide comes in.',
    // run starts right of centre near halfway (ref frame 1)
    ballStart: { x: 2.0, y: 44 },
    keeper: { x: 0, y: 2.0, reach: 0.95, reaction: 0.3, diveSpeed: 5, kit: '#d9c23a', kit2: '#222222' },
    // oncoming challenges: a two-man gate (frame 2), then the edge-of-box challenge (frame 3)
    defenders: [
      { x: -0.5, y: 32 },
      { x: 3.5,  y: 32 },
      { x: 1.5,  y: 19 },
      { x: -2.5, y: 21 }
    ],
    defKit: '#ffffff', defKit2: '#1a2a5a',     // England white, navy shorts
    selfKit: '#1d3a8f', selfKit2: '#1a1a1a',   // Argentina dark blue (Mexico '86 away)
    wind: { min: 0, max: 0 },
    // jog pace 6.2 vs chasers 7.3: you MUST sprint (tap) to stay ahead
    script: { runSpeed: 6.2, chaserSpeed: 7.3, steerSpeed: 3.4, keeperRushAt: 14, slideTime: 1.4, boostMax: 3.5 }
  }
];

// ---------- GAME STATE ----------
let gameState = 'TITLE';   // TITLE, INTRO, SETUP, AIM, POWER, FLIGHT, RESULT, COMPLETE
let levelIdx = 0;          // index into LEVELS
let level = null;          // current level config
let attemptsThisLevel = 0; // unlimited attempts; we log how many it took
let totalAttemptsUsed = 0;
let goalsScored = [];      // { id, attempts } of completed levels
let resultText = '';
let resultGood = false;
let resultTimer = 0;
let stateTime = 0;         // seconds in current state

// per-attempt
let wind = 0;              // lateral accel m/s^2 (+ = blows right)
const ball = { x: 0, y: 23, z: 0.11, vx: 0, vy: 0, vz: 0, spin: 0, live: false, rest: false };
const aim = { targetX: 0, angle: 22, locked: false, dragging: false, sx: 0, sy: 0 };
const power = { v: 0, dir: 1, locked: 0, speed: 1.35 };
const keeperState = { x: 0, y: 2, handZ: 1.0, diving: false, t: 0, predX: 0, predZ: 0, saved: false };
const incoming = { bounced: false, bounceTime: 0 };  // bouncing-ball setup phase
const volley = { chested: false, peaked: false };    // chest-and-volley phase (James)
let strikeQuality = 0;     // seconds off the sweet spot (0 = perfect)
// dribble mechanic runtime (Maradona)
const dyn = {
  px: 0, py: 0,            // player position
  steer: 0, boost: 0,      // -1/0/1 lateral input; tap-sprint boost
  defs: [],                // live copies of oncoming defenders
  chasers: [],             // defenders chasing from behind
  kX: 0, kY: 0,            // keeper rushing out
  rushing: false, beaten: false, rounded: false,
  slider: null,            // recovering slide tackler {x, y}
  slideT: 0
};
let kickOrigin = { x: 0, y: 23 };  // where the kick happened (for the boot anim)
let kickAnim = 0;          // foot swing timer
let trail = [];            // recent ball positions for flight ribbon
let flightTime = 0;
let netRipple = 0;
let savedCheckDone = false;
let crossedGoalLine = false;

// ---------- AUDIO (lazy init, procedural) ----------
let actx = null;
function audio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  return actx;
}
function sfxKick(pw) {
  try {
    const a = audio(), t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(120 + pw * 60, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + 0.16);
  } catch (e) {}
}
function sfxCrowd(goal) {
  try {
    const a = audio(), t = a.currentTime;
    const len = goal ? 2.2 : 0.8;
    const buf = a.createBuffer(1, a.sampleRate * len, a.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(goal ? 1200 : 500, t);
    const g = a.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(goal ? 0.45 : 0.12, t + 0.15);
    g.gain.exponentialRampToValueAtTime(0.001, t + len);
    src.connect(f).connect(g).connect(a.destination);
    src.start(t);
  } catch (e) {}
}

// ---------- INPUT (pointer events: mouse + touch) ----------
const TOUCH = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;

function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  if (rotated) {
    // canvas is rotated 90° clockwise: screen-down = game +x, screen-left = game +y
    return { x: (e.clientY - r.top) * (W / r.height), y: (r.right - e.clientX) * (H / r.width) };
  }
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  audio();
  canvas.setPointerCapture(e.pointerId);
  const p = canvasPos(e);
  onPress(p.x, p.y);
});
canvas.addEventListener('pointercancel', () => onRelease());
canvas.addEventListener('pointermove', e => {
  const p = canvasPos(e);
  onMove(p.x, p.y);
});
canvas.addEventListener('pointerup', e => {
  e.preventDefault();
  onRelease();
});

function onPress(x, y) {
  switch (gameState) {
    case 'TITLE':
      levelIdx = firstImplemented(0);
      enterIntro();
      break;
    case 'INTRO':
      if (stateTime > 0.4) enterAim();
      break;
    case 'SETUP':
      strikeIncomingBall();
      break;
    case 'DRIBBLE':
      if (dyn.rounded) { shootSlot(); break; }
      dyn.steer = x < W / 2 ? -1 : 1;          // hold a side to steer
      dyn.boost = Math.min(dyn.boost + 1.3, level.script.boostMax); // each tap is a burst of pace
      break;
    case 'AIM':
      aim.dragging = true;
      aim.sx = x; aim.sy = y;
      break;
    case 'POWER':
      lockPowerAndKick();
      break;
    case 'RESULT':
      if (stateTime > 0.9) advanceFromResult();
      break;
    case 'COMPLETE':
      if (stateTime > 0.9) resetGame();
      break;
  }
}

function onMove(x, y) {
  if (gameState === 'AIM' && aim.dragging) {
    const dx = x - aim.sx;
    const dy = y - aim.sy;
    aim.targetX = clamp(dx / 28, -7.5, 7.5);            // drag right = aim right
    aim.angle   = clamp(22 - dy / 9, 6, 42);            // drag UP = more loft
  }
}

function onRelease() {
  if (gameState === 'AIM' && aim.dragging) {
    aim.dragging = false;
    aim.locked = true;
    setState('POWER');
  }
  if (gameState === 'DRIBBLE') {
    dyn.steer = 0;
    // if the shot window opened while the steer button was held, release fires it
    if (dyn.rounded) shootSlot();
  }
}

// keyboard support for the dribble (arrows steer, space sprints/shoots)
window.addEventListener('keydown', e => {
  if (gameState !== 'DRIBBLE') return;
  if (e.code === 'ArrowLeft')  { dyn.steer = -1; e.preventDefault(); }
  if (e.code === 'ArrowRight') { dyn.steer = 1;  e.preventDefault(); }
  if (e.code === 'Space') {
    e.preventDefault();
    if (dyn.rounded) shootSlot();
    else dyn.boost = Math.min(dyn.boost + 1.3, level.script.boostMax);
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' && dyn.steer === -1) dyn.steer = 0;
  if (e.code === 'ArrowRight' && dyn.steer === 1) dyn.steer = 0;
});

// ---------- STATE HELPERS ----------
function setState(s) { gameState = s; stateTime = 0; }

function firstImplemented(from) {
  for (let i = from; i < LEVELS.length; i++) if (LEVELS[i].implemented) return i;
  return -1;
}

function enterIntro() {
  level = LEVELS[levelIdx];
  attemptsThisLevel = 0;
  setState('INTRO');
}

function enterAim() {
  // fresh attempt
  attemptsThisLevel++;
  CAM.x = level.ballStart.x;
  CAM.y = level.ballStart.y + CAM.behind;
  ball.x = level.ballStart.x; ball.y = level.ballStart.y; ball.z = 0.11;
  ball.vx = ball.vy = ball.vz = 0; ball.spin = 0;
  ball.live = false; ball.rest = false;
  aim.targetX = 0; aim.angle = 22; aim.locked = false; aim.dragging = false;
  power.v = 0; power.dir = 1; power.locked = 0;
  keeperState.x = level.keeper.x; keeperState.y = level.keeper.y; keeperState.handZ = 1.0;
  keeperState.diving = false; keeperState.t = 0; keeperState.saved = false;
  wind = rand(level.wind.min, level.wind.max);
  trail = []; flightTime = 0; netRipple = 0;
  savedCheckDone = false; crossedGoalLine = false;
  kickAnim = 0;
  strikeQuality = 0;

  if (level.mechanic === 'lob') {
    // bouncing ball drops in from ahead; player times the strike
    const s = level.script;
    ball.x = s.inX; ball.y = s.inY; ball.z = s.inZ;
    ball.vx = s.inVx; ball.vy = s.inVy; ball.vz = 0;
    incoming.bounced = false; incoming.bounceTime = 0;
    setState('SETUP');
  } else if (level.mechanic === 'volley') {
    // long ball drops out of the sky toward the chest
    const s = level.script;
    ball.x = s.inX; ball.y = s.inY; ball.z = s.inZ;
    ball.vx = s.inVx; ball.vy = s.inVy; ball.vz = 0;
    volley.chested = false; volley.peaked = false;
    setState('SETUP');
  } else if (level.mechanic === 'header') {
    // flighted cross arcs in from the left wing
    const s = level.script;
    ball.x = s.inX; ball.y = s.inY; ball.z = s.inZ;
    ball.vx = s.inVx; ball.vy = s.inVy; ball.vz = s.inVz;
    setState('SETUP');
  } else if (level.mechanic === 'dribble') {
    dyn.px = level.ballStart.x; dyn.py = level.ballStart.y;
    dyn.steer = 0; dyn.boost = 0;
    dyn.defs = level.defenders.map(d => ({ x: d.x, y: d.y, alive: true }));
    dyn.chasers = [
      { x: level.ballStart.x - 1.5, y: level.ballStart.y + 4 },
      { x: level.ballStart.x + 2.0, y: level.ballStart.y + 5.5 }
    ];
    dyn.kX = level.keeper.x; dyn.kY = level.keeper.y;
    dyn.rushing = false; dyn.beaten = false; dyn.rounded = false;
    dyn.slider = null; dyn.slideT = 0;
    ball.x = dyn.px; ball.y = dyn.py - 1.3;
    setState('DRIBBLE');
  } else if (level.mechanic === 'firsttime') {
    // Pel\u00e9's lay-off rolls across the turf into the strike zone
    const s = level.script;
    ball.x = s.fromX; ball.y = s.fromY; ball.z = 0.11;
    const dx = level.ballStart.x - s.fromX, dy = level.ballStart.y - s.fromY;
    const d = Math.hypot(dx, dy);
    ball.vx = s.rollSpeed * dx / d;
    ball.vy = s.rollSpeed * dy / d;
    ball.vz = 0;
    setState('SETUP');
  } else {
    setState('AIM');
  }
}

// ---------- BOUNCING-BALL SETUP PHASE (Houghton) ----------
function simIncoming(dt) {
  if (level.mechanic === 'firsttime') {
    // rolling pass: constant speed across the turf
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    if (stateTime > level.script.sweetT + 0.5) finishAttempt(false, 'IT ROLLED PAST!');
    return;
  }
  if (level.mechanic === 'header') {
    // flighted cross: smooth arc from the left, no bounce — leap before it drops
    ball.vz -= GRAV * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    ball.z += ball.vz * dt;
    if (ball.z < 0.2 && ball.vz < 0) finishAttempt(false, 'IT DROPPED \u2014 TOO LATE!');
    return;
  }
  if (level.mechanic === 'volley') {
    // dropping long ball: chest it, then volley it before it hits the turf
    ball.vz -= GRAV * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    ball.z += ball.vz * dt;
    if (volley.chested && ball.vz < 0) volley.peaked = true;
    if (ball.z < (volley.chested ? 0.24 : 0.5)) {
      finishAttempt(false, volley.chested ? 'TOO LATE \u2014 IT DROPPED!' : 'YOU LET IT DROP!');
    }
    return;
  }
  // lob: dropping, bouncing ball
  ball.vz -= GRAV * dt;
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  ball.z += ball.vz * dt;
  if (ball.z < 0.11 && ball.vz < 0) {
    ball.z = 0.11;
    ball.vz *= -0.55;
    ball.vy *= 0.85;
    if (!incoming.bounced) { incoming.bounced = true; incoming.bounceTime = stateTime; }
  }
  // ball got past the player
  if (ball.y < 21.8) finishAttempt(false, 'IT GOT AWAY!');
}

function setupReady() {
  // is the ball inside the strikeable window?
  if (level.mechanic === 'firsttime') return stateTime > level.script.sweetT - 0.45;
  if (level.mechanic === 'header') return stateTime > level.script.sweetT - 0.45;
  if (level.mechanic === 'volley') {
    return volley.chested ? volley.peaked : ball.z < 2.6;
  }
  return incoming.bounced;
}

function strikeIncomingBall() {
  if (level.mechanic === 'volley') {
    const s = level.script;
    if (!volley.chested) {
      // chest control: too early = can't reach it yet (ignore the tap)
      if (ball.z > s.chestPop) return;
      // the height you take it on the chest IS the power: high = full power
      power.locked = clamp((ball.z - 0.5) / 1.7, 0.05, 1);
      volley.chested = true; volley.peaked = false;
      // cushion it up off the chest, killing the drop
      ball.vz = 2.7; ball.vy = -0.3; ball.vx *= 0.2;
      sfxKick(0.15);
      return;
    }
    // the volley: timing = height of contact as it falls back down
    const off = volley.peaked
      ? clamp((ball.z - s.sweetZ) * 0.55, -0.45, 0.5)
      : 0.5;                                           // swung while it was still rising
    strikeQuality = off;
    kickAnim = 0.22;
    if (Math.abs(off) > 0.38) {
      // horrible connection: shanked
      aim.targetX = ball.x + rand(-3, 3);
      aim.angle = off > 0 ? 38 : 4;
      kickBall(9);
      finishKickSound(0.1);
      return;
    }
    // clean strike: timing shapes direction & dip, chest height set the power
    aim.targetX = clamp(0.5 + off * 10 + rand(-0.5, 0.5), -6, 6);
    aim.angle   = clamp(26 + off * 26, 6, 42);
    const speed = 13 + power.locked * 9;               // 13..22 m/s
    sfxKick(power.locked);
    kickBall(speed);
    return;
  }
  // quality = seconds off the sweet moment
  let off;
  if (level.mechanic === 'firsttime') {
    off = stateTime - level.script.sweetT;
  } else if (level.mechanic === 'header') {
    // the leap: dive too early/late and you sail past the ball entirely
    off = stateTime - level.script.sweetT;
    strikeQuality = off;
    kickAnim = 0.22;
    if (Math.abs(off) > 0.4) {
      finishAttempt(false, off < 0 ? 'YOU LEAPT TOO EARLY!' : 'YOU LEAPT TOO LATE!');
    } else {
      setState('POWER');
    }
    return;
  } else {
    // lob: just after the bounce, on the rise
    off = incoming.bounced ? (stateTime - incoming.bounceTime - level.script.sweet) : -0.5;
  }
  strikeQuality = off;
  kickAnim = 0.22;
  if (Math.abs(off) > 0.4) {
    // total mistime: scuffed along the ground
    aim.targetX = ball.x + rand(-2, 2);
    aim.angle = 4;
    power.locked = 0;
    kickBall(8);
    finishKickSound(0.1);
  } else {
    // clean enough contact: timing shapes direction and loft, power comes next
    setState('POWER');
  }
}

// ---------- DRIBBLE PHASE (Maradona) ----------
function simDribble(dt) {
  const s = level.script;

  // forward speed: base + tap-sprint boost (decays)
  dyn.boost = Math.max(0, dyn.boost - 2.0 * dt);
  const speed = s.runSpeed + dyn.boost;
  dyn.py -= speed * dt;
  dyn.px = clamp(dyn.px + dyn.steer * s.steerSpeed * dt, -7, 7);

  // ball at the feet, pushed ahead with each stride
  ball.x = dyn.px;
  ball.y = dyn.py - 1.3;
  ball.z = 0.11 + Math.abs(Math.sin(stateTime * (4 + speed))) * 0.1;  // strides quicken with pace

  // camera tracks the run
  CAM.x += (dyn.px - CAM.x) * Math.min(8 * dt, 1);
  CAM.y = dyn.py + CAM.behind;

  // oncoming defenders close down the runner
  for (const d of dyn.defs) {
    if (!d.alive) continue;
    d.y -= 1.4 * dt;                                       // step toward you
    d.x += clamp(dyn.px - d.x, -1.6 * dt, 1.6 * dt);        // shadow your lane
    if (d.y > dyn.py - 0.2 && d.y < dyn.py + 0.6 && Math.abs(d.x - dyn.px) < 0.7) {
      finishAttempt(false, 'TACKLED!');
      return;
    }
    if (d.y > dyn.py + 0.6) d.alive = false;               // beaten, drops off
  }

  // chasers hunt you down from behind
  for (const c of dyn.chasers) {
    c.y -= s.chaserSpeed * dt;
    c.x += clamp(dyn.px - c.x, -2.2 * dt, 2.2 * dt);
    if (c.y < dyn.py + 0.6 && Math.abs(c.x - dyn.px) < 0.8) {
      finishAttempt(false, 'CAUGHT FROM BEHIND!');
      return;
    }
  }

  // keeper rushes out once you near the box
  if (!dyn.rushing && dyn.py < s.keeperRushAt) dyn.rushing = true;
  if (dyn.rushing && !dyn.rounded) {
    dyn.kY += 3.5 * dt;
    dyn.kX += clamp(dyn.px - dyn.kX, -2.2 * dt, 2.2 * dt);
    if (dyn.py < dyn.kY + 0.5 && dyn.py > dyn.kY - 0.5 && Math.abs(dyn.px - dyn.kX) < 1.1) {
      finishAttempt(false, 'SMOTHERED BY THE KEEPER!');
      return;
    }
    if (dyn.py < dyn.kY - 0.5) {
      // round him! a defender comes sliding across — finish quickly
      dyn.rounded = true; dyn.beaten = true;
      dyn.slideT = 0;
      dyn.slider = { x: dyn.px + 3.5, y: dyn.py - 2 };
      savedCheckDone = true;                               // keeper is beaten, no save check
    }
  }
  keeperState.x = dyn.kX; keeperState.y = dyn.kY;

  if (dyn.rounded) {
    dyn.slideT += dt;
    // slider scythes in toward the ball
    const sl = dyn.slider;
    const dx = ball.x - sl.x, dy0 = ball.y - sl.y;
    const d = Math.hypot(dx, dy0) || 0.01;
    sl.x += (dx / d) * 6.5 * dt;
    sl.y += (dy0 / d) * 6.5 * dt;
    if (Math.hypot(ball.x - sl.x, ball.y - sl.y) < 0.7 || dyn.slideT > s.slideTime || dyn.py < 3.2) {
      finishAttempt(false, 'SLIDE TACKLE! TOO SLOW!');
      return;
    }
  }
}

function shootSlot() {
  // quick low finish into the open net, angled away from the slider
  aim.targetX = clamp(-dyn.px * 0.4 + rand(-0.6, 0.6), -2.8, 2.8);
  aim.angle = 9;
  power.locked = 0.6;
  kickAnim = 0.22;
  sfxKick(0.5);
  kickBall(Math.min(14 + ball.y * 0.9, 28));   // scale with distance so it never dies short
}

function kickBall(speed) {
  kickOrigin.x = ball.x; kickOrigin.y = ball.y;
  const angRad = aim.angle * Math.PI / 180;
  const dx = aim.targetX - ball.x;
  const dy = 0 - ball.y;
  const flat = Math.hypot(dx, dy);
  const hSpeed = speed * Math.cos(angRad);
  ball.vx = hSpeed * dx / flat;
  ball.vy = hSpeed * dy / flat;
  ball.vz = speed * Math.sin(angRad);
  ball.live = true;
  keeperState.t = 0;
  setState('FLIGHT');
}
function finishKickSound(p) { sfxKick(p); }

function lockPowerAndKick() {
  power.locked = power.v;
  let speed = 11 + power.locked * 19;                    // 11..30 m/s
  if (level.mechanic === 'header') {
    // a header carries less pace than a boot: it's all about the loop
    speed = 8 + power.locked * 12;                       // 8..20 m/s
    const off = strikeQuality;
    aim.targetX = clamp(-0.8 + off * 12 + rand(-0.5, 0.5), -6, 6);
    aim.angle   = clamp(28 - off * 30, 8, 40);
  } else if (level.mechanic === 'lob') {
    // strike timing shapes the shot: early pulls left & loops, late pushes right & flattens
    // perfect contact drops it left of centre, over the keeper (as Houghton's did)
    const off = strikeQuality;
    aim.targetX = clamp(-1.2 + off * 14 + rand(-0.5, 0.5), -6, 6);
    aim.angle   = clamp(27 - off * 35, 8, 40);
  } else if (level.mechanic === 'firsttime') {
    // sweet contact drills it low into the far corner; mistimes balloon or spray
    const off = strikeQuality;
    aim.targetX = clamp(-2.8 + off * 12 + rand(-0.4, 0.4), -6, 6);
    aim.angle   = clamp(8 + Math.abs(off) * 28, 5, 30);
  }
  kickAnim = 0.22;
  sfxKick(power.locked);
  kickBall(speed);
}

function finishAttempt(good, text) {
  resultGood = good;
  resultText = text;
  totalAttemptsUsed++;
  if (good) {
    goalsScored.push({ id: level.id, attempts: attemptsThisLevel });
    netRipple = 1;
    sfxCrowd(true);
  } else {
    sfxCrowd(false);
  }
  setState('RESULT');
}

function advanceFromResult() {
  if (resultGood) {
    const next = firstImplemented(levelIdx + 1);
    if (next === -1) { setState('COMPLETE'); }
    else { levelIdx = next; enterIntro(); }
  } else {
    enterAim();  // unlimited attempts — straight back on the ball
  }
}

function resetGame() {
  goalsScored = [];
  totalAttemptsUsed = 0;
  setState('TITLE');
}

// ---------- BALL SIMULATION ----------
function simBall(dt) {
  if (!ball.live) return;
  flightTime += dt;

  const prev = { x: ball.x, y: ball.y, z: ball.z };

  // forces
  ball.vz -= GRAV * dt;
  const decay = Math.exp(-DRAG * dt);
  ball.vx *= decay; ball.vy *= decay; ball.vz *= decay;
  ball.vx += wind * dt;                                 // wind
  ball.vx += ball.spin * Math.hypot(ball.vx, ball.vy) * 0.06 * dt; // curve (unused for lob)

  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  ball.z += ball.vz * dt;

  // ground bounce
  if (ball.z < 0.11 && ball.vz < 0) {
    ball.z = 0.11;
    ball.vz *= -0.45;
    ball.vx *= 0.8; ball.vy *= 0.8;
    if (Math.abs(ball.vz) < 0.6) ball.vz = 0;
  }

  trail.push({ x: ball.x, y: ball.y, z: ball.z });
  if (trail.length > 90) trail.shift();

  // defender block check (crossing each defender's depth plane)
  if (level.defenders && ball.vy < 0) {
    for (const d of level.defenders) {
      if (prev.y > d.y && ball.y <= d.y) {
        const t = (prev.y - d.y) / (prev.y - ball.y);
        const ix = prev.x + (ball.x - prev.x) * t;
        const iz = prev.z + (ball.z - prev.z) * t;
        if (Math.abs(ix - d.x) < 0.45 && iz < 1.9) {
          ball.vy *= -0.3; ball.vx += rand(-2, 2); ball.vz *= 0.5;
          finishAttempt(false, 'BLOCKED!');
          return;
        }
      }
    }
  }

  // keeper save check (crossing keeper depth plane)
  if (!savedCheckDone && ball.vy < 0 && prev.y > level.keeper.y && ball.y <= level.keeper.y) {
    savedCheckDone = true;
    const t = (prev.y - level.keeper.y) / (prev.y - ball.y);
    const ix = prev.x + (ball.x - prev.x) * t;
    const iz = prev.z + (ball.z - prev.z) * t;
    const dx = ix - keeperState.x;
    const dz = iz - keeperState.handZ;
    if (Math.hypot(dx, dz) < level.keeper.reach) {
      keeperState.saved = true;
      // snap keeper's hands to the ball so the save reads clearly on screen
      keeperState.x = ix; keeperState.predX = ix;
      keeperState.handZ = iz; keeperState.predZ = iz;
      ball.x = ix; ball.y = level.keeper.y; ball.z = Math.max(iz, 0.11);
      ball.vy *= -0.15; ball.vx = rand(-1.5, 1.5); ball.vz = Math.max(ball.vz * -0.2, 0);
      finishAttempt(false, 'SAVED BY THE KEEPER!');
      return;
    }
  }

  // goal line check
  if (!crossedGoalLine && ball.vy < 0 && prev.y > 0 && ball.y <= 0) {
    crossedGoalLine = true;
    const t = prev.y / (prev.y - ball.y);
    const ix = prev.x + (ball.x - prev.x) * t;
    const iz = prev.z + (ball.z - prev.z) * t;

    // woodwork
    const hitPost = (Math.abs(Math.abs(ix) - GOAL_HW) < POST_R) && iz < BAR_H + POST_R;
    const hitBar  = Math.abs(iz - BAR_H) < POST_R && Math.abs(ix) < GOAL_HW + POST_R;
    // a dipping ball clipping the underside of the bar goes IN (the James goal)
    if (hitBar && !hitPost && iz < BAR_H && ball.vz < 0 && Math.abs(ix) < GOAL_HW) {
      ball.vy *= 0.2; ball.vx *= 0.2; ball.vz = -Math.abs(ball.vz) * 0.4;
      finishAttempt(true, 'IN OFF THE BAR!');
      return;
    }
    if (hitBar || hitPost) {
      ball.y = 0.05;
      if (hitBar) { ball.vz = -Math.abs(ball.vz) * 0.5; ball.vy *= -0.5; }
      else { ball.vx *= -0.6; ball.vy *= -0.5; }
      finishAttempt(false, hitBar ? 'OFF THE BAR!' : 'OFF THE POST!');
      return;
    }

    if (Math.abs(ix) < GOAL_HW && iz < BAR_H) {
      ball.vy *= 0.25; ball.vx *= 0.25;                 // caught by the net
      finishAttempt(true, 'GOOOOAL!');
      return;
    }

    finishAttempt(false, iz >= BAR_H ? 'OVER THE BAR!' : 'WIDE!');
    return;
  }

  // ball died without reaching goal
  if (flightTime > 6 || (ball.z <= 0.12 && Math.hypot(ball.vx, ball.vy) < 0.8)) {
    finishAttempt(false, 'NEVER REACHED...');
  }
}

// ---------- KEEPER AI ----------
function updateKeeper(dt) {
  if (level.mechanic === 'dribble') return;  // dribble moves the keeper itself
  const k = level.keeper;
  if (gameState !== 'FLIGHT' || keeperState.saved) {
    // idle sway
    keeperState.x += (k.x + Math.sin(stateTime * 1.5) * 0.12 - keeperState.x) * 0.1;
    return;
  }
  keeperState.t += dt;
  if (keeperState.t < k.reaction) return;

  if (!keeperState.diving) {
    keeperState.diving = true;
    // predict ball x/z when it reaches the keeper's plane (no drag, rough)
    const vy = Math.abs(ball.vy) || 0.01;
    const tt = Math.max((ball.y - k.y) / vy, 0);
    keeperState.predX = ball.x + ball.vx * tt + 0.5 * wind * tt * tt;
    let pz = ball.z + ball.vz * tt - 0.5 * GRAV * tt * tt;
    keeperState.predZ = clamp(pz, 0.2, 3.4);
  }
  // move hands toward prediction, capped by dive speed
  const maxStep = k.diveSpeed * dt;
  keeperState.x += clamp(keeperState.predX - keeperState.x, -maxStep, maxStep);
  // hands can't track a ball sailing well over his head (max ~2.0m hand height)
  keeperState.handZ += clamp(Math.min(keeperState.predZ, 2.0) - keeperState.handZ, -maxStep, maxStep);
}

// ---------- UPDATE ----------
function update(dt) {
  stateTime += dt;
  if (kickAnim > 0) kickAnim -= dt;
  if (netRipple > 0) netRipple -= dt * 0.7;

  if (gameState === 'POWER') {
    power.v += power.dir * power.speed * dt;
    if (power.v >= 1) { power.v = 1; power.dir = -1; }
    if (power.v <= 0) { power.v = 0; power.dir = 1; }
  }

  if (gameState === 'SETUP') simIncoming(dt);
  if (gameState === 'DRIBBLE') simDribble(dt);

  if (gameState === 'FLIGHT' || gameState === 'RESULT') {
    if (level) updateKeeper(dt);
    if (gameState === 'FLIGHT') simBall(dt);
    else if (ball.live) {
      // let the ball settle gently in the background of the result card
      ball.x += ball.vx * dt; ball.y += ball.vy * dt;
      ball.z = Math.max(0.11, ball.z + ball.vz * dt);
      ball.vz -= GRAV * dt;
      if (ball.z <= 0.11) { ball.vz = 0; ball.vx *= 0.9; ball.vy *= 0.9; }
    }
  } else if (level && gameState !== 'TITLE') {
    updateKeeper(dt);
  }
}

// ---------- DRAWING ----------
function draw() {
  drawScene();
  switch (gameState) {
    case 'TITLE':    drawTitle(); break;
    case 'INTRO':    drawIntro(); break;
    case 'SETUP':    drawHUD(); drawSetup(); break;
    case 'DRIBBLE':  drawHUD(); drawDribbleHUD(); break;
    case 'AIM':      drawHUD(); drawAim(); break;
    case 'POWER':    drawHUD(); if (level.mechanic !== 'lob' && level.mechanic !== 'firsttime' && level.mechanic !== 'header') drawAim(); drawPowerBar(); break;
    case 'FLIGHT':   drawHUD(); break;
    case 'RESULT':   drawHUD(); drawResult(); break;
    case 'COMPLETE': drawComplete(); break;
  }
}

function drawScene() {
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, CAM.horizon);
  sky.addColorStop(0, '#7ec8e8');
  sky.addColorStop(1, '#cfe9f5');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, CAM.horizon);

  // crowd band
  ctx.fillStyle = '#5a4a52';
  ctx.fillRect(0, CAM.horizon - 46, W, 46);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  for (let i = 0; i < 260; i++) {
    const cx = (i * 53.7) % W;
    const cy = CAM.horizon - 44 + ((i * 31.3) % 42);
    ctx.fillRect(cx, cy, 2, 2);
  }
  // stand roof line
  ctx.fillStyle = '#3a3138';
  ctx.fillRect(0, CAM.horizon - 52, W, 7);

  // pitch
  ctx.fillStyle = '#3f9e4d';
  ctx.fillRect(0, CAM.horizon, W, H - CAM.horizon);

  // mowing stripes (horizontal bands in depth)
  for (let i = 0; i < 14; i++) {
    const y0 = i * 4, y1 = y0 + 4;
    if (y0 > CAM.y) break;
    const a = project(0, Math.min(y1, CAM.y - 0.7), 0);
    const b = project(0, y0, 0);
    if (i % 2 === 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(0, Math.min(a.y, b.y), W, Math.abs(b.y - a.y));
    }
  }

  drawPitchLines();
  drawGoal();

  // entities painter-ordered far -> near
  const ents = [];
  const dribbleLive = level && level.mechanic === 'dribble' &&
    (gameState === 'DRIBBLE' || gameState === 'FLIGHT' || gameState === 'RESULT');
  if (dribbleLive) {
    ents.push({ y: keeperState.y, fn: drawKeeper });
    for (const d of dyn.defs) if (d.alive && d.y < CAM.y - 1.5) {
      ents.push({ y: d.y, fn: () => drawPlayer(d.x, d.y, level.defKit, level.defKit2) });
    }
    for (const c of dyn.chasers) if (c.y < CAM.y - 1.5) {
      ents.push({ y: c.y, fn: () => drawPlayer(c.x, c.y, level.defKit, level.defKit2) });
    }
    if (dyn.slider) {
      const sl = dyn.slider;
      ents.push({ y: sl.y, fn: () => drawSlidingPlayer(sl.x, sl.y, level.defKit, level.defKit2) });
    }
    ents.push({ y: ball.y, fn: drawBall });
  } else if (level && gameState !== 'TITLE') {
    ents.push({ y: keeperState.y, fn: drawKeeper });
    if (level.defenders) for (const d of level.defenders) {
      ents.push({ y: d.y, fn: () => drawPlayer(d.x, d.y, level.defKit, level.defKit2) });
    }
    if (level.mates) for (const m of level.mates) {
      ents.push({ y: m.y, fn: () => drawPlayer(m.x, m.y, level.selfKit, level.selfKit2) });
    }
    ents.push({ y: ball.y, fn: drawBall });
  } else {
    // title screen dressing: a ball on the spot
    ents.push({ y: 23, fn: () => drawBallAt(0, 23, 0.11) });
  }
  // far (small y) first, near (large y) last
  ents.sort((a, b) => a.y - b.y);
  for (const e of ents) e.fn();

  if (kickAnim > 0) drawFoot();
}

function drawPitchLines() {
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 2;
  // goal line
  lineW(-14, 0, 14, 0);
  // six yard box
  boxW(-2.75 - 2.0, 0, 2.75 + 2.0, 5.5);
  // penalty box
  boxW(-3.66 - 12.5, 0, 3.66 + 12.5, 16.5);
  // penalty spot
  const ps = project(0, 11, 0);
  ctx.beginPath(); ctx.arc(ps.x, ps.y, 2.5, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill();
}
function lineW(x1, y1, x2, y2) {
  const a = project(x1, y1, 0), b = project(x2, y2, 0);
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
}
function boxW(x1, yGoal, x2, depth) {
  lineW(x1, yGoal, x1, depth);
  lineW(x2, yGoal, x2, depth);
  lineW(x1, depth, x2, depth);
}

function drawGoal() {
  const tl = project(-GOAL_HW, 0, BAR_H);
  const tr = project(GOAL_HW, 0, BAR_H);
  const bl = project(-GOAL_HW, 0, 0);
  const br = project(GOAL_HW, 0, 0);
  const depth = 1.8; // net depth
  const tlb = project(-GOAL_HW, -depth, BAR_H * 0.85);
  const trb = project(GOAL_HW, -depth, BAR_H * 0.85);
  const blb = project(-GOAL_HW, -depth, 0);
  const brb = project(GOAL_HW, -depth, 0);

  // net (back panel + sides), with goal ripple offset
  const rip = netRipple > 0 ? Math.sin(netRipple * 18) * netRipple * 6 : 0;
  ctx.strokeStyle = 'rgba(230,230,230,0.55)';
  ctx.lineWidth = 1;
  // back panel verticals & horizontals
  for (let i = 0; i <= 10; i++) {
    const t = i / 10;
    ctx.beginPath();
    ctx.moveTo(lerp(tlb.x, trb.x, t), lerp(tlb.y, trb.y, t) + rip * 0.4);
    ctx.lineTo(lerp(blb.x, brb.x, t), lerp(blb.y, brb.y, t));
    ctx.stroke();
  }
  for (let i = 0; i <= 5; i++) {
    const t = i / 5;
    ctx.beginPath();
    ctx.moveTo(lerp(tlb.x, blb.x, t), lerp(tlb.y, blb.y, t) + rip * (1 - t));
    ctx.lineTo(lerp(trb.x, brb.x, t), lerp(trb.y, brb.y, t) + rip * (1 - t));
    ctx.stroke();
  }
  // side nets
  ctx.beginPath(); ctx.moveTo(tl.x, tl.y); ctx.lineTo(tlb.x, tlb.y); ctx.lineTo(blb.x, blb.y); ctx.lineTo(bl.x, bl.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tr.x, tr.y); ctx.lineTo(trb.x, trb.y); ctx.lineTo(brb.x, brb.y); ctx.lineTo(br.x, br.y); ctx.stroke();
  // roof net
  ctx.beginPath(); ctx.moveTo(tl.x, tl.y); ctx.lineTo(tlb.x, tlb.y); ctx.lineTo(trb.x, trb.y); ctx.lineTo(tr.x, tr.y); ctx.stroke();

  // frame
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = Math.max(3, tl.s * 0.12);
  ctx.beginPath();
  ctx.moveTo(bl.x, bl.y); ctx.lineTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y); ctx.lineTo(br.x, br.y);
  ctx.stroke();
}

function drawPlayer(x, y, kit, kit2) {
  const p = project(x, y, 0);
  const hM = 1.8;                     // height in metres
  const h = hM * p.s;
  const w = h * 0.34;
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y, w * 0.8, w * 0.22, 0, 0, Math.PI * 2); ctx.fill();
  // legs (shorts kit2)
  ctx.fillStyle = kit2;
  ctx.fillRect(p.x - w * 0.32, p.y - h * 0.45, w * 0.26, h * 0.2);
  ctx.fillRect(p.x + w * 0.06, p.y - h * 0.45, w * 0.26, h * 0.2);
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(p.x - w * 0.32, p.y - h * 0.25, w * 0.26, h * 0.25);
  ctx.fillRect(p.x + w * 0.06, p.y - h * 0.25, w * 0.26, h * 0.25);
  // torso
  ctx.fillStyle = kit;
  ctx.fillRect(p.x - w * 0.5, p.y - h * 0.82, w, h * 0.38);
  // head
  ctx.fillStyle = '#e8b88f';
  ctx.beginPath(); ctx.arc(p.x, p.y - h * 0.9, h * 0.09, 0, Math.PI * 2); ctx.fill();
}

function drawKeeper() {
  const k = level.keeper;
  const p = project(keeperState.x, keeperState.y, 0);
  const h = 1.88 * p.s;
  const w = h * 0.36;
  const dive = keeperState.diving;
  const lean = dive ? clamp((keeperState.predX - k.x) * 0.35, -0.9, 0.9) : 0;

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(lean);
  // shadow drawn unrotated would be nicer; acceptable
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(0, 0, w * 0.85, w * 0.24, 0, 0, Math.PI * 2); ctx.fill();
  // legs
  ctx.fillStyle = k.kit2;
  ctx.fillRect(-w * 0.32, -h * 0.48, w * 0.26, h * 0.48);
  ctx.fillRect(w * 0.06, -h * 0.48, w * 0.26, h * 0.48);
  // torso
  ctx.fillStyle = k.kit;
  ctx.fillRect(-w * 0.5, -h * 0.84, w, h * 0.4);
  // arms (raised toward hand height)
  const armUp = clamp((keeperState.handZ - 1.0) / 1.6, 0, 1);
  ctx.strokeStyle = k.kit;
  ctx.lineWidth = Math.max(2, w * 0.18);
  ctx.beginPath();
  ctx.moveTo(-w * 0.5, -h * 0.78);
  ctx.lineTo(-w * (0.75 + armUp * 0.1), -h * (0.78 + armUp * 0.32));
  ctx.moveTo(w * 0.5, -h * 0.78);
  ctx.lineTo(w * (0.75 + armUp * 0.1), -h * (0.78 + armUp * 0.32));
  ctx.stroke();
  // gloves
  ctx.fillStyle = '#ffe14d';
  ctx.beginPath(); ctx.arc(-w * (0.75 + armUp * 0.1), -h * (0.78 + armUp * 0.32), w * 0.12, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(w * (0.75 + armUp * 0.1), -h * (0.78 + armUp * 0.32), w * 0.12, 0, Math.PI * 2); ctx.fill();
  // head
  ctx.fillStyle = '#e8b88f';
  ctx.beginPath(); ctx.arc(0, -h * 0.92, h * 0.09, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawSlidingPlayer(x, y, kit, kit2) {
  // a defender scything in along the ground
  const p = project(x, y, 0);
  const h = 1.8 * p.s;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y, h * 0.4, h * 0.08, 0, 0, Math.PI * 2); ctx.fill();
  // body low and horizontal
  ctx.fillStyle = kit;
  ctx.fillRect(p.x - h * 0.38, p.y - h * 0.16, h * 0.5, h * 0.13);
  ctx.fillStyle = kit2;
  ctx.fillRect(p.x + h * 0.12, p.y - h * 0.14, h * 0.28, h * 0.11);
  // outstretched leg
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(p.x + h * 0.38, p.y - h * 0.12, h * 0.18, h * 0.07);
  // head up
  ctx.fillStyle = '#e8b88f';
  ctx.beginPath(); ctx.arc(p.x - h * 0.42, p.y - h * 0.2, h * 0.08, 0, Math.PI * 2); ctx.fill();
}

function drawBall() { drawBallAt(ball.x, ball.y, ball.z); }

function drawBallAt(bx, by, bz) {
  // flight trail
  if (trail.length > 2 && (gameState === 'FLIGHT' || gameState === 'RESULT')) {
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < trail.length; i += 3) {
      const tp = project(trail[i].x, trail[i].y, trail[i].z);
      i === 0 ? ctx.moveTo(tp.x, tp.y) : ctx.lineTo(tp.x, tp.y);
    }
    ctx.stroke();
  }
  // shadow (key depth cue)
  const sh = project(bx, by, 0);
  const p = project(bx, by, bz);
  const r = Math.max(0.11 * p.s, 2.5);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(sh.x, sh.y, r * 0.9, r * 0.35, 0, 0, Math.PI * 2); ctx.fill();
  // ball
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#999';
  ctx.lineWidth = 1;
  ctx.stroke();
  // simple panel marks
  ctx.fillStyle = '#444';
  ctx.beginPath(); ctx.arc(p.x - r * 0.3, p.y - r * 0.2, r * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(p.x + r * 0.35, p.y + r * 0.25, r * 0.16, 0, Math.PI * 2); ctx.fill();
}

function drawFoot() {
  // first-person boot swinging in where the kick happened
  const p = project(kickOrigin.x, kickOrigin.y, 0.11);
  const t = 1 - kickAnim / 0.22;
  const x = p.x + 60 - t * 55;
  const y = p.y + 50 - t * 40;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.5 + t * 0.6);
  ctx.fillStyle = level ? level.selfKit2 || '#fff' : '#fff';
  ctx.fillRect(-8, -34, 16, 26);   // sock
  ctx.fillStyle = '#222';
  ctx.beginPath();                  // boot
  ctx.ellipse(0, 0, 16, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ---------- HUD ----------
function drawHUD() {
  // wind indicator (only for levels that use wind)
  if (level.wind.min !== 0 || level.wind.max !== 0) {
    const wx = W - 90, wy = 38;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    roundRect(wx - 52, wy - 24, 124, 48, 8); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('WIND', wx + 10, wy - 8);
    const mag = Math.abs(wind);
    ctx.fillText(mag.toFixed(1) + ' m/s', wx + 10, wy + 18);
    // arrow
    const dir = wind >= 0 ? 1 : -1;
    const len = clamp(mag * 12, 6, 34);
    ctx.strokeStyle = mag > 1.4 ? '#ff8855' : '#aaffaa';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(wx + 10 - dir * len / 2, wy + 2);
    ctx.lineTo(wx + 10 + dir * len / 2, wy + 2);
    ctx.lineTo(wx + 10 + dir * (len / 2 - 6), wy - 3);
    ctx.moveTo(wx + 10 + dir * len / 2, wy + 2);
    ctx.lineTo(wx + 10 + dir * (len / 2 - 6), wy + 7);
    ctx.stroke();
  }

  // attempt counter
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRect(14, 18, 150, 26, 6); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px "Courier New", monospace';
  ctx.fillText('ATTEMPT ' + attemptsThisLevel, 24, 35);

  // level tag
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRect(14, 50, 240, 26, 6); ctx.fill();
  ctx.fillStyle = '#ffe14d';
  ctx.font = 'bold 12px "Courier New", monospace';
  ctx.fillText('LVL ' + (levelIdx + 1) + ' · ' + level.title, 24, 67);
}

function drawSetup() {
  // pulsing strike zone where the ball should be met (just after the bounce)
  const p = project(level.ballStart.x, level.ballStart.y, 0);
  const pulse = 1 + Math.sin(stateTime * 7) * 0.15;
  const ready = setupReady();
  ctx.strokeStyle = ready ? 'rgba(255,225,77,0.95)' : 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, 46 * pulse, 15 * pulse, 0, 0, Math.PI * 2);
  ctx.stroke();
  if (level.mechanic === 'volley') {
    drawChestGauge();
    if (!volley.chested) {
      drawPrompt(ready ? 'CHEST IT! TAKE IT HIGH FOR POWER!' : 'WAIT \u2014 IT\u2019S DROPPING IN...');
    } else {
      drawPrompt(ready ? 'NOW! TAP TO VOLLEY!' : 'OFF THE CHEST... WAIT FOR THE DROP...');
    }
    return;
  }
  if (level.mechanic === 'header') {
    drawPrompt(ready ? 'LEAP NOW! TAP TO DIVE!' : 'READ THE FLIGHT \u2014 IT\u2019S COMING FROM THE LEFT...');
    return;
  }
  const waitText = level.mechanic === 'firsttime' ? 'WAIT FOR THE PASS...' : 'WAIT FOR THE BOUNCE...';
  drawPrompt(ready ? 'NOW! TAP TO STRIKE!' : waitText);
}

function drawChestGauge() {
  // vertical gauge: power you'd bank if you chested the ball right now
  const gx = 30, gy = 150, gh = 170;
  const live = !volley.chested
    ? clamp((ball.z - 0.5) / 1.7, 0, 1)
    : power.locked;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  roundRect(gx - 12, gy - 30, 70, gh + 50, 6); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(volley.chested ? 'POWER' : 'CHEST', gx + 23, gy - 16);
  ctx.fillText(volley.chested ? 'BANKED' : 'POWER', gx + 23, gy - 5);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
  ctx.strokeRect(gx + 13, gy, 20, gh);
  const fh = gh * live;
  ctx.fillStyle = live > 0.75 ? '#6fdc6f' : (live > 0.5 ? '#ffe14d' : '#ff8855');
  ctx.fillRect(gx + 13, gy + (gh - fh), 20, fh);
  ctx.fillStyle = '#fff';
  ctx.fillText(Math.round(live * 100) + '%', gx + 23, gy + gh + 14);
}

function drawDribbleHUD() {
  const bMax = level.script.boostMax;

  // speed streaks at the screen edges when sprinting
  if (dyn.boost > 0.8) {
    const a = Math.min((dyn.boost - 0.8) / (bMax - 0.8), 1);
    ctx.strokeStyle = 'rgba(255,255,255,' + (a * 0.5).toFixed(2) + ')';
    ctx.lineWidth = 2;
    for (let i = 0; i < 10; i++) {
      const sy = 80 + ((i * 97 + stateTime * 900) % (H - 160));
      const len = 30 + a * 60;
      const off = (i % 2) * 30;
      ctx.beginPath();
      ctx.moveTo(20 + off, sy); ctx.lineTo(20 + off + len, sy + len * 0.5);
      ctx.moveTo(W - 20 - off, sy); ctx.lineTo(W - 20 - off - len, sy + len * 0.5);
      ctx.stroke();
    }
  }

  // pace bar (boost level)
  const bw = 200, bx = (W - bw) / 2, by = H - 78;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  roundRect(bx - 6, by - 6, bw + 12, 22, 6); ctx.fill();
  ctx.fillStyle = dyn.boost > bMax * 0.55 ? '#6fdc6f' : '#ffe14d';
  ctx.fillRect(bx, by, bw * (dyn.boost / bMax), 10);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, 10);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(dyn.boost > 0.8 ? 'SPRINTING!' : (TOUCH ? 'PACE \u2014 TAP TO SPRINT' : 'PACE \u2014 CLICK TO SPRINT'), W / 2, by - 10);

  // chaser gap meter: how close the hunt is behind you
  if (!dyn.rounded) {
    let gap = 99;
    for (const c of dyn.chasers) gap = Math.min(gap, c.y - dyn.py);
    const gFrac = clamp(gap / 6, 0, 1);              // 6m+ = safe
    const gx = 24, gy = 120, gh = 130;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRect(gx - 8, gy - 26, 64, gh + 38, 6); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px "Courier New", monospace';
    ctx.fillText('CHASER', gx + 24, gy - 12);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.strokeRect(gx + 14, gy, 20, gh);
    const fh = gh * (1 - gFrac);                     // fills up as they close in
    ctx.fillStyle = gFrac < 0.4 ? '#ff5544' : (gFrac < 0.7 ? '#ffe14d' : '#6fdc6f');
    ctx.fillRect(gx + 14, gy + (gh - fh), 20, fh);
    ctx.fillStyle = '#fff';
    ctx.fillText(gFrac < 0.4 ? 'SPRINT!' : gap.toFixed(0) + 'm', gx + 24, gy + gh + 16);
  }

  if (dyn.rounded) {
    // shot window: unmissable instruction
    if (Math.floor(stateTime * 6) % 2 === 0) {
      ctx.fillStyle = '#ff5544';
      ctx.font = 'bold 34px "Courier New", monospace';
      ctx.fillText('SHOOT NOW!', W / 2, 140);
    }
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.fillText(TOUCH ? 'TAP THE SCREEN' : 'CLICK OR PRESS SPACE', W / 2, 170);
    return;
  }

  if (dyn.rushing) {
    // keeper is coming: tell the player what to do
    if (Math.floor(stateTime * 5) % 2 === 0) {
      ctx.fillStyle = '#ffe14d';
      ctx.font = 'bold 24px "Courier New", monospace';
      ctx.fillText('KEEPER\u2019S COMING \u2014 SWERVE ROUND HIM!', W / 2, 140);
    }
    return;
  }

  // chaser proximity warning
  let gap = 99;
  for (const c of dyn.chasers) gap = Math.min(gap, c.y - dyn.py);
  if (gap < 2.5 && Math.floor(stateTime * 5) % 2 === 0) {
    ctx.fillStyle = '#ff8855';
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillText("THEY'RE ON YOUR HEELS! SPRINT!", W / 2, 130);
  }
  drawPrompt(TOUCH ? 'TAP = SPRINT \u00b7 HOLD LEFT/RIGHT SIDE = STEER' : 'CLICK = SPRINT \u00b7 HOLD LEFT/RIGHT SIDE = STEER');
}

function drawAim() {
  // aim arrow from ball toward target, loft shown by arc height
  const from = project(ball.x, ball.y, 0.11);
  const to = project(aim.targetX, 0, 0);
  const loftLift = (aim.angle - 6) / 36;             // 0..1
  const midX = (from.x + to.x) / 2;
  const midY = (from.y + to.y) / 2 - loftLift * 150;

  ctx.strokeStyle = 'rgba(255,225,77,0.9)';
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  ctx.moveTo(from.x, from.y);
  ctx.quadraticCurveTo(midX, midY, to.x, to.y);
  ctx.stroke();
  ctx.setLineDash([]);

  // target marker on the goal line
  ctx.strokeStyle = '#ffe14d';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(to.x, to.y, 7, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(to.x - 11, to.y); ctx.lineTo(to.x + 11, to.y);
  ctx.moveTo(to.x, to.y - 11); ctx.lineTo(to.x, to.y + 11); ctx.stroke();

  // loft gauge
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRect(14, H - 130, 24, 100, 6); ctx.fill();
  ctx.fillStyle = '#ffe14d';
  const gh = loftLift * 92;
  ctx.fillRect(18, H - 34 - gh, 16, gh + 4);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('LOFT', 26, H - 136);

  if (gameState === 'AIM') {
    drawPrompt(aim.dragging ? 'RELEASE TO SET AIM' : 'DRAG TO AIM · UP FOR LOFT');
  }
}

function drawPowerBar() {
  const bw = 360, bh = 26;
  const bx = (W - bw) / 2, by = H - 56;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(bx - 6, by - 6, bw + 12, bh + 12, 8); ctx.fill();
  // gradient fill
  const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  g.addColorStop(0, '#6fdc6f');
  g.addColorStop(0.6, '#ffe14d');
  g.addColorStop(1, '#ff5544');
  ctx.fillStyle = g;
  ctx.fillRect(bx, by, bw * power.v, bh);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('POWER — TAP TO STRIKE', W / 2, by - 14);
  // contact quality feedback (timed-strike mechanics)
  if (level.mechanic === 'lob' || level.mechanic === 'firsttime' || level.mechanic === 'header') {
    const q = Math.abs(strikeQuality);
    const sweet = level.mechanic === 'header' ? 'PERFECT LEAP!' : 'SWEET CONTACT!';
    ctx.fillStyle = q < 0.12 ? '#6fdc6f' : '#ffe14d';
    ctx.fillText(q < 0.12 ? sweet : (strikeQuality < 0 ? 'BIT EARLY...' : 'BIT LATE...'), W / 2, by - 34);
  }
  if (level.mechanic === 'header') {
    ctx.fillStyle = '#aaffaa';
    ctx.fillText('NOT TOO MUCH \u2014 LOOP IT OVER HIM', W / 2, by - 52);
  }
}

function drawPrompt(text) {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(W / 2 - 170, H - 36, 340, 26, 6); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(text, W / 2, H - 18);
}

// ---------- SCREENS ----------
function drawMascot(id, cx, feetY, h, bob) {
  const img = mascotImgs[id];
  if (!img || !img.complete || !img.naturalHeight) return;
  const w = h * img.naturalWidth / img.naturalHeight;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(cx, feetY, w * 0.42, 11, 0, 0, Math.PI * 2); ctx.fill();
  ctx.drawImage(img, cx - w / 2, feetY - h - bob, w, h);
}

function drawTitle() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  drawMascot('intro', W * 0.8, 545, 330, 0);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffe14d';
  ctx.font = 'bold 44px "Courier New", monospace';
  ctx.fillText('I COULD HAVE', W / 2, 200);
  ctx.fillText('SCORED THAT!', W / 2, 250);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillText('FIVE REAL WORLD CUP GOALS. YOUR BOOTS.', W / 2, 300);
  const n = LEVELS.filter(l => l.implemented).length;
  ctx.fillStyle = '#aaffaa';
  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.fillText(n === 5 ? 'ALL 5 LEVELS PLAYABLE' : 'EARLY BUILD · ' + n + ' OF 5 LEVELS PLAYABLE', W / 2, 336);
  if (Math.floor(stateTime * 2) % 2 === 0) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px "Courier New", monospace';
    ctx.fillText('TAP TO KICK OFF', W / 2, 420);
  }
}

function drawIntro() {
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#aaffaa';
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillText('LEVEL ' + (levelIdx + 1) + ' OF 5', W / 2, 170);
  ctx.fillStyle = '#ffe14d';
  ctx.font = 'bold 38px "Courier New", monospace';
  ctx.fillText(level.title, W / 2, 225);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px "Courier New", monospace';
  ctx.fillText(level.subtitle + ' · ' + level.venue, W / 2, 262);
  ctx.font = '15px "Courier New", monospace';
  const briefEnd = wrapText(level.brief, W / 2, 320, 520, 22);

  // mechanic instructions — start clear of the brief, never overlapping
  let lines = null;
  if (level.mechanic === 'firsttime') {
    lines = ['WATCH: Pel\u00e9 rolls it across your path', 'STRIKE: tap as it arrives \u2014 timing sets the direction', 'POWER: tap the bar \u2014 corners need plenty'];
  } else if (level.mechanic === 'lob') {
    lines = ['WATCH: the ball bounces in to you', 'STRIKE: tap on the bounce \u2014 timing shapes the lob', 'POWER: tap the bar \u2014 clear the keeper, under the bar'];
  } else if (level.mechanic === 'dribble') {
    lines = TOUCH
      ? ['STEER: hold LEFT/RIGHT side of screen', 'SPRINT: rapid taps', 'SHOOT: once past the keeper \u2014 tap']
      : ['STEER: hold LEFT/RIGHT side of screen (or arrow keys)', 'SPRINT: rapid clicks (or SPACE)', 'SHOOT: once past the keeper \u2014 click or SPACE'];
  } else if (level.mechanic === 'volley') {
    lines = ['CHEST: tap as the ball drops \u2014 the higher you take it,', 'the more POWER you bank (you need plenty from 25 yards)', 'VOLLEY: tap again as it falls \u2014 timing sets the direction'];
  } else if (level.mechanic === 'header') {
    lines = ['READ: watch the cross drop in from the left', 'LEAP: tap to dive as it arrives \u2014 timing is everything', 'POWER: tap the bar gently \u2014 loop it, don\u2019t lash it'];
  }
  let iy = briefEnd + 40;
  if (lines) {
    ctx.fillStyle = '#aaffaa';
    ctx.font = 'bold 16px "Courier New", monospace';
    for (const ln of lines) { ctx.fillText(ln, W / 2, iy); iy += 26; }
  }
  if (stateTime > 0.4 && Math.floor(stateTime * 2) % 2 === 0) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.fillText('TAP TO PLAY', W / 2, iy + 22);
  }
}

function drawResult() {
  if (stateTime < 0.35) return;   // let the moment breathe
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 140, W, 180);
  if (resultGood) drawCelebration();
  const tx = resultGood ? W * 0.64 : W / 2;   // goal: text right, scorer celebrates left
  ctx.textAlign = 'center';
  ctx.fillStyle = resultGood ? '#6fdc6f' : '#ff8855';
  ctx.font = 'bold 42px "Courier New", monospace';
  ctx.fillText(resultText, tx, 215);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px "Courier New", monospace';
  if (resultGood) {
    ctx.fillText('JUST LIKE ' + level.title + ' —', tx, 250);
    ctx.fillText('SCORED IN ' + attemptsThisLevel +
      ' ATTEMPT' + (attemptsThisLevel === 1 ? '' : 'S') + '.', tx, 272);
  } else {
    ctx.fillText('I could have scored that... tap to go again.', tx, 255);
  }
  if (stateTime > 0.9 && Math.floor(stateTime * 2) % 2 === 0) {
    ctx.fillText('TAP TO CONTINUE', tx, resultGood ? 304 : 295);
  }
}

// celebration artwork: posterized cutouts of the real goalscorers
// (generated from match photos; see WorldCupGoals/Celebrations_Art)

const mascotImgs = {};
for (const id in MASCOT_ART) {
  const im = new Image();
  im.src = MASCOT_ART[id];

function drawCelebration() {
  const cx = W * 0.23, feetY = 478;
  const bob = Math.abs(Math.sin(stateTime * 5)) * 12;   // jumping for joy

  // confetti drifting down around the scorer
  const confCols = ['#ffe14d', '#ffffff', '#ff5544', '#6fdc6f', level.selfKit];
  for (let i = 0; i < 26; i++) {
    const fx = cx - 130 + ((i * 67.3) % 280);
    const fy = 150 + ((i * 41.7 + stateTime * 70) % 310);
    ctx.fillStyle = confCols[i % confCols.length];
    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(i + stateTime * 3);
    ctx.fillRect(-3, -2, 6, 4);
    ctx.restore();
  }

  const img = celebImgs[level.id];
  if (img && img.complete && img.naturalHeight) {
    const h = 330, w = h * img.naturalWidth / img.naturalHeight;
    // soft ground shadow so the cutout sits on the pitch
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(cx, feetY, w * 0.42, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.drawImage(img, cx - w / 2, feetY - h - bob, w, h);
    return;
  }
  drawCelebrationDuo(cx, feetY, bob);   // fallback if art is missing
}

// canvas-drawn celebration duo (fallback): the scorer leaps,
// arms in the air, and a teammate jumps into the hug
function drawCelebrationDuo(cx, feetY, bob) {
  const kit = level.selfKit, kit2 = level.selfKit2;
  const h = 240, w = h * 0.36;
  const skin = '#e8b88f';

  // ---- scorer: back to camera, arms in a V ----
  const sx = cx + w * 0.3, sy = feetY - bob;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(sx, feetY, w * 0.95, w * 0.2, 0, 0, Math.PI * 2); ctx.fill();
  // legs: boots, socks, skin
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(sx - w * 0.34, sy - h * 0.05, w * 0.26, h * 0.05);
  ctx.fillRect(sx + w * 0.08, sy - h * 0.05, w * 0.26, h * 0.05);
  ctx.fillStyle = kit2;
  ctx.fillRect(sx - w * 0.34, sy - h * 0.2, w * 0.26, h * 0.16);
  ctx.fillRect(sx + w * 0.08, sy - h * 0.2, w * 0.26, h * 0.16);
  ctx.fillStyle = skin;
  ctx.fillRect(sx - w * 0.34, sy - h * 0.42, w * 0.26, h * 0.23);
  ctx.fillRect(sx + w * 0.08, sy - h * 0.42, w * 0.26, h * 0.23);
  // shorts
  ctx.fillStyle = kit2;
  ctx.fillRect(sx - w * 0.46, sy - h * 0.55, w * 0.92, h * 0.14);
  // torso
  ctx.fillStyle = kit;
  ctx.fillRect(sx - w * 0.5, sy - h * 0.86, w, h * 0.33);
  // shirt number on the back
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2;
  ctx.font = 'bold ' + Math.round(h * 0.16) + 'px "Courier New", monospace';
  ctx.textAlign = 'center';
  const num = level.num || 10;
  ctx.strokeText(num, sx, sy - h * 0.6);
  ctx.fillText(num, sx, sy - h * 0.6);
  // arms thrown up in a V
  ctx.strokeStyle = kit;
  ctx.lineWidth = w * 0.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(sx - w * 0.45, sy - h * 0.8);
  ctx.lineTo(sx - w * 0.95, sy - h * 1.06);
  ctx.moveTo(sx + w * 0.45, sy - h * 0.8);
  ctx.lineTo(sx + w * 0.95, sy - h * 1.06);
  ctx.stroke();
  // fists
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(sx - w * 0.98, sy - h * 1.08, w * 0.13, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx + w * 0.98, sy - h * 1.08, w * 0.13, 0, Math.PI * 2); ctx.fill();
  // head + hair
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(sx, sy - h * 0.95, h * 0.085, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2a1c10';
  ctx.beginPath(); ctx.arc(sx, sy - h * 0.97, h * 0.085, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();

  // ---- teammate: leaping in from the left, wrapping him in a hug ----
  const tBob = Math.abs(Math.sin(stateTime * 5 + 0.7)) * 12;
  const mx = sx - w * 1.05, my = feetY - 24 - tBob;
  const mh = h * 0.92, mw = mh * 0.36;
  ctx.save();
  ctx.translate(mx, my);
  ctx.rotate(0.32);                                     // airborne, leaning into the hug
  // trailing legs kicked up behind
  ctx.fillStyle = skin;
  ctx.fillRect(-mw * 0.5, -mh * 0.28, mw * 0.26, mh * 0.26);
  ctx.fillRect(-mw * 0.14, -mh * 0.24, mw * 0.26, mh * 0.22);
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(-mw * 0.5, -mh * 0.04, mw * 0.26, mh * 0.05);
  ctx.fillRect(-mw * 0.14, -mh * 0.02, mw * 0.26, mh * 0.05);
  // shorts
  ctx.fillStyle = kit2;
  ctx.fillRect(-mw * 0.5, -mh * 0.42, mw * 0.85, mh * 0.15);
  // torso
  ctx.fillStyle = kit;
  ctx.fillRect(-mw * 0.5, -mh * 0.74, mw, mh * 0.34);
  // head buried into the scorer's shoulder
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(mw * 0.42, -mh * 0.8, mh * 0.085, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a1208';
  ctx.beginPath(); ctx.arc(mw * 0.38, -mh * 0.83, mh * 0.08, Math.PI * 0.9, Math.PI * 2.1); ctx.fill();
  ctx.restore();
  // hugging arm reaching across the scorer's chest (drawn unrotated, on top)
  ctx.strokeStyle = kit;
  ctx.lineWidth = w * 0.18;
  ctx.beginPath();
  ctx.moveTo(mx + mw * 0.2, my - mh * 0.62);
  ctx.quadraticCurveTo(sx, sy - h * 0.86, sx + w * 0.42, sy - h * 0.72);
  ctx.stroke();
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(sx + w * 0.42, sy - h * 0.72, w * 0.12, 0, Math.PI * 2); ctx.fill();
  ctx.lineCap = 'butt';
}

function drawComplete() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);

  // mascot lifting the trophy, confetti raining around him
  const mx = W * 0.82;
  const confCols = ['#ffe14d', '#ffffff', '#ff5544', '#6fdc6f', '#5ab0ff'];
  for (let i = 0; i < 26; i++) {
    const fx = mx - 130 + ((i * 67.3) % 260);
    const fy = 130 + ((i * 41.7 + stateTime * 70) % 400);
    ctx.fillStyle = confCols[i % confCols.length];
    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(i + stateTime * 3);
    ctx.fillRect(-3, -2, 6, 4);
    ctx.restore();
  }
  drawMascot('outro', mx, 555, 340, Math.abs(Math.sin(stateTime * 5)) * 10);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffe14d';
  ctx.font = 'bold 36px "Courier New", monospace';
  ctx.fillText('YOU SCORED THAT!', W * 0.42, 150);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px "Courier New", monospace';
  ctx.fillText('Goals recreated in this build:', W * 0.42, 200);
  let yy = 240;
  for (const g of goalsScored) {
    const l = LEVELS.find(v => v.id === g.id);
    ctx.fillStyle = '#6fdc6f';
    ctx.fillText('\u26BD ' + l.title + ' — ' + g.attempts + ' attempt' + (g.attempts === 1 ? '' : 's'), W * 0.42, yy);
    yy += 30;
  }
  ctx.fillStyle = '#aaffaa';
  ctx.fillText('Total attempts used: ' + totalAttemptsUsed, W * 0.42, yy + 20);
  if (stateTime > 0.9 && Math.floor(stateTime * 2) % 2 === 0) {
    ctx.fillStyle = '#fff';
    ctx.fillText('TAP TO PLAY AGAIN', W * 0.42, yy + 70);
  }
}

// ---------- UTILS ----------
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function wrapText(text, x, y, maxW, lh) {
  const words = text.split(' ');
  let line = '';
  for (const w0 of words) {
    const test = line + w0 + ' ';
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line.trim(), x, y);
      line = w0 + ' ';
      y += lh;
    } else line = test;
  }
  ctx.fillText(line.trim(), x, y);
  return y;
}

// ---------- MAIN LOOP ----------
// init a default level context so the title screen has a scene
level = LEVELS[firstImplemented(0)];
CAM.x = level.ballStart.x; CAM.y = level.ballStart.y + CAM.behind;
keeperState.x = level.keeper.x;
level = null; // cleared until INTRO; title uses static dressing
// keep a static camera for title
CAM.x = -2; CAM.y = 28;

let lastTs = 0;
function loop(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(ts => { lastTs = ts; requestAnimationFrame(loop); });
</script>
